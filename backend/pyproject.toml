[project]
name = "eduintel-backend"
version = "0.1.0"
description = "EduIntel — AI-powered education intelligence & intervention platform (backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
